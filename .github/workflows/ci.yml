name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Test, format, and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run tests
        run: cargo test --locked
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  distribution:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build distribution archive
        run: ./scripts/package-release.sh "${{ matrix.target }}"
      - name: Test bundled FFmpeg
        run: ./scripts/test-local-distribution.sh
        env:
          GIFMP4_PACKAGE_TARGET: ${{ matrix.target }}
      - name: Test curl installer
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          ./scripts/test-install.sh "dist/gifmp4-${version}-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: gifmp4-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
